<mat-card>
  <mat-card-header>
    <mat-card-title>Orders</mat-card-title>
    <mat-card-subtitle>Order Service - Port 8083</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div *ngIf="loading" class="loading-container">
      <mat-spinner></mat-spinner>
      <p>Loading orders...</p>
    </div>
    
    <div *ngIf="error && !loading" class="error-container">
      <p class="error-message">{{ error }}</p>
    </div>
    
    <div *ngIf="!loading && !error">
      <table mat-table [dataSource]="orders" class="mat-elevation-z8">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let order">{{ order.id }}</td>
        </ng-container>
        
        <ng-container matColumnDef="orderNumber">
          <th mat-header-cell *matHeaderCellDef>Order Number</th>
          <td mat-cell *matCellDef="let order">{{ order.orderNumber }}</td>
        </ng-container>
        
        <ng-container matColumnDef="customerName">
          <th mat-header-cell *matHeaderCellDef>Customer</th>
          <td mat-cell *matCellDef="let order">{{ order.customerName }}</td>
        </ng-container>
        
        <ng-container matColumnDef="orderDate">
          <th mat-header-cell *matHeaderCellDef>Order Date</th>
          <td mat-cell *matCellDef="let order">{{ order.orderDate | date }}</td>
        </ng-container>
        
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let order">{{ order.status }}</td>
        </ng-container>
        
        <ng-container matColumnDef="totalAmount">
          <th mat-header-cell *matHeaderCellDef>Total Amount</th>
          <td mat-cell *matCellDef="let order">{{ order.totalAmount | currency }}</td>
        </ng-container>
        
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
